# Independent headless PRSE game-server transport.
# Browser page remains at the original /llm_game/ URL; no existing web alias changes.
ProxyPass "/llm_game_runtime/ws" "ws://127.0.0.1:18764/ws" retry=0 timeout=180
ProxyPassReverse "/llm_game_runtime/ws" "ws://127.0.0.1:18764/ws"
ProxyPass "/llm_game_runtime/health" "http://127.0.0.1:18764/health" retry=0 timeout=10
ProxyPassReverse "/llm_game_runtime/health" "http://127.0.0.1:18764/health"
<Location "/llm_game_runtime/">
    Require all granted
    Header always set Cache-Control "no-store"
</Location>
