<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141e29"><title>World Physics — Prototype</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><strong>World Physics</strong><span> A small world to explore</span></div><div id="status" role="status">Loading physics…</div></header><section class="stage"><canvas id="scene" tabindex="0" aria-label="Game scene: move, jump, push the crate, cross the fence"></canvas><aside class="overlay"><span id="location">The clearing</span><span id="message">Move to explore.</span></aside></section><div class="bar"><div class="actions"><button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button><button id="jump">Jump</button><button id="goal">Cross fence</button><button id="cancel">Cancel goal</button></div><div class="ragdoll-controls" aria-label="Mannequin physics controls"><span class="control-heading">Mannequin</span><button id="ragdoll-balance">Stand</button><button id="ragdoll-walk">Step</button><button id="ragdoll-relax">Go limp</button><button id="ragdoll">Push</button><button id="ragdoll-injure">Sprain knee</button><button id="ragdoll-heal">Heal</button></div><form id="semantic-form" class="semantic-form"><label for="semantic-input">Command</label><input id="semantic-input" type="text" maxlength="120" placeholder="e.g. jump over fence" autocomplete="off" spellcheck="false"><button type="submit">Do</button></form><div class="management"><button id="save">Save</button><button id="load">Load</button><button id="restart">Restart</button></div></div><footer><span>Keyboard: A / D or ← / → · Space to jump · G to cross · Esc to interrupt · Type a command</span><span id="details">3D rigid-body physics · 2D rendering · offline after loading</span></footer></main><script type="module" src="game.js"></script></body></html>
